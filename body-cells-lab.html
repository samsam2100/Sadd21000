<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<style>
:root{--bg:#f5f6fc;--c:#fff;--ink:#20213a;--mu:#73758e;--ln:#e8e8f2;--p:#7657e8;--pl:#f0edff;--g:#15966b;--gl:#e8f7f0;--r:#d64d68;--rl:#fff0f2;--al:#fff8eb;box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11102b;--c:#1c1a45;--ink:#f0eeff;--mu:#b9b7d8;--ln:#34316b;--pl:#2b2766;--gl:#12372c;--rl:#43202b;--al:#3d2f12}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,'Segoe UI',sans-serif;line-height:1.7}
.w{max-width:760px;margin:auto;padding:12px}
header{background:linear-gradient(120deg,#17143b,#4b3aa8);color:#fff;border-radius:18px;padding:16px}
h1{font-size:19px;margin:0}.bar{display:flex;gap:14px;margin-top:6px;font-size:13px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:16px;margin:10px 0;overflow:hidden}
.hd{display:flex;gap:10px;align-items:center;padding:14px;cursor:pointer;font-weight:700}
.hd small{display:block;color:var(--mu);font-weight:400;font-size:12px}.bd{padding:0 14px 14px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--c);color:var(--ink);border-radius:12px;padding:9px 12px;margin:3px}
.pri{background:var(--p);color:#fff;border-color:var(--p)}.ok{background:var(--gl)!important;border-color:var(--g)}.no{background:var(--rl)!important;border-color:var(--r)}
.hint{background:var(--al)}.tag{display:inline-block;background:var(--pl);color:var(--p);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;margin:4px 0}
.box{background:var(--pl);border-radius:12px;padding:10px;margin:8px 0}.big{font-size:40px;text-align:center}
textarea{width:100%;min-height:70px;border:1px solid var(--ln);border-radius:12px;padding:8px;background:var(--c);color:var(--ink);font:inherit;box-sizing:border-box}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid2 button{margin:0}
#rt{height:110px;border-radius:14px;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--p);margin:8px 0;cursor:pointer;user-select:none;text-align:center;padding:6px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:12px}
</style>
</head>

const $=id=>document.getElementById(id);
let st={};try{st=JSON.parse(localStorage.getItem("bl1"))||{}}catch(e){}
st.pts=st.pts||0;st.done=st.done||{};st.tr=st.tr||{};
let open=null,step={},cur={};
const save=()=>{try{localStorage.setItem("bl1",JSON.stringify(st))}catch(e){}};
const add=n=>{st.pts+=n;save();$("pts").textContent=st.pts};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const speak=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";speechSynthesis.speak(u)}catch(e){}};
function B(t,f,c){const b=document.createElement("button");b.textContent=t;b.onclick=f;if(c)b.className=c;return b}

function pulse(t){t.classList.add("hint");setTimeout(()=>t.classList.remove("hint"),1500)}
function render(){
 $("pts").textContent=st.pts;$("prog").textContent=Object.keys(st.done).length+" / "+S.length;
 $("list").innerHTML=S.map((s,i)=>`<div class="card"><div class="hd" onclick="tog(${i})"><span style="font-size:28px">${s.i}</span><span>${s.t}<small>${s.l}</small></span><span style="margin-right:auto">${st.done[i]?"✅":open===i?"▾":"◂"}</span></div>${open===i?'<div class="bd" id="bd"></div>':""}</div>`).join("");
 if(open!==null)V(open)}
function tog(i){open=open===i?null:i;step[i]=0;render()}
function V(i){
 const s=S[i],b=$("bd"),p=step[i],tr=st.tr[i]||"r";b.innerHTML="";
 const H=x=>{const d=document.createElement("div");d.innerHTML=x;b.appendChild(d);return d};
 const nx=()=>b.appendChild(B("التالي ◂",()=>{step[i]++;V(i)},"pri"));
 const T=()=>{const d=H(`<span class="tag">${tr=="e"?"🚀 مسار إثرائي":"🌱 مسار علاجي"}</span>`);d.appendChild(B("🔄 غيّري المسار",()=>{st.tr[i]=tr=="e"?"r":"e";save();V(i)}))};
 if(p==0){cur.a=[];H('<span class="tag">1 · اختبار قصير</span>');
  s.d.forEach((d,q)=>{const w=H(`<b>${d[0]}</b><br>`);shuf(d[1].map((t,j)=>[t,j==0])).forEach(([t,ok])=>w.appendChild(B(t,e=>{cur.a[q]=ok;w.querySelectorAll("button").forEach(x=>x.className="");e.target.className="pri"})))});

 else if(p==1){T();H(`<span class="tag">2 · شاهدي واستمعي</span><div class="big">${s.v}</div><div class="box">${s.k}</div>${tr=="e"?`<div class="box hint">🚀 للمتقدمات: ${s.e}</div>`:""}`);b.appendChild(B("🔊 اقرئي لي",()=>speak(s.k+(tr=="e"?s.e:""))));nx()}
 else if(p==2){T();H('<span class="tag">3 · جرّبي بنفسك</span>');let n=0;
  const fin=pt=>{add(pt+(tr=="e"?1:0));if(++n==s.a.length)nx()};

function match(el,c,fin,hn){let sel=null,ok=0,er=0;el.innerHTML=`<b>${c.t}</b>`;const g=document.createElement("div");g.className="grid2";const L=document.createElement("div"),R=document.createElement("div");g.append(L,R);el.appendChild(g);

  const x=q[k];el.innerHTML=`<b>${c.t}</b><div class="big">${x[0]}</div><p style="text-align:center">${x[1]}</p>`;const w=document.createElement("div");w.className="grid2";
